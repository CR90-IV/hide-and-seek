<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hider Cheat Sheet</title>

    <!-- External CDN Resources -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Local Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gray-50 min-h-screen pb-24">
    <!-- Header -->
    <header class="bg-white border-b-4 border-gray-900 p-4 shadow-sm">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Hide and Seek</h1>
            <p class="text-gray-600 text-base mt-1 font-medium">Click a question to copy to clipboard</p>
            <div class="flex gap-2 mt-3">
                <div class="relative flex-1 max-w-xs">
                    <select id="view-selector" onchange="switchView(this.value)"
                        class="w-full bg-white hover:bg-gray-50 border-2 border-gray-300 text-gray-700 px-4 py-2 pr-10 shadow-sm text-sm font-semibold tracking-wide transition-all appearance-none cursor-pointer"
                        style="border-radius: 4px;">
                        <option value="detail">DETAIL VIEW</option>
                        <option value="overview">OVERVIEW</option>
                        <option value="history">HISTORY</option>
                    </select>
                    <span
                        class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none text-lg">expand_more</span>
                </div>
                <button onclick="resetAll()"
                    class="bg-gray-900 hover:bg-gray-800 text-white px-4 py-2 shadow-sm text-sm font-semibold tracking-wide transition-all"
                    style="border-radius: 4px;">
                    <span class="material-symbols-outlined text-base align-middle mr-1">refresh</span>
                    RESET
                </button>
            </div>
        </div>
    </header>

    <!-- Toast notification -->
    <div id="toast"
        class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 shadow-2xl z-50 hidden text-base border-l-4 border-green-400"
        style="border-radius: 4px;">
        <span class="material-symbols-outlined text-lg align-middle mr-2">check_circle</span>
        COPIED TO CLIPBOARD
    </div>

    <!-- Detail View -->
    <main id="normal-view" class="max-w-7xl mx-auto p-4">
        <div id="questions-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            <!-- Questions will be dynamically rendered here -->
        </div>
    </main>

    <!-- Overview View -->
    <main id="overview-view" class="max-w-4xl mx-auto p-4 space-y-6 hidden">
        <!-- Overview grid will be dynamically rendered here -->
    </main>

    <!-- History View -->
    <main id="history-view" class="max-w-4xl mx-auto p-4 hidden">
        <div class="bg-white border-2 border-gray-300 shadow-sm" style="border-radius: 4px;">
            <div class="border-b-2 border-gray-300 p-4">
                <h2 class="text-xl font-bold text-gray-900 uppercase tracking-wide flex items-center">
                    <span class="material-symbols-outlined mr-2 text-2xl">history</span>
                    Question History
                </h2>
            </div>
            <div id="history-list" class="p-4">
                <!-- History items will be rendered here -->
            </div>
        </div>
    </main>

    <!-- External JavaScript (load in order) -->
    <script src="questions-data.js"></script>
    <script src="app.js"></script>
</body>

</html>
